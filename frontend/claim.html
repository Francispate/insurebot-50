<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Claim - InsureBot</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <nav class="navbar solid" style="padding:0 40px;">
        <div class="nav-logo">🛡️ InsureBot</div>
        <div class="nav-actions">
            <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
            <a href="dashboard.html" class="btn btn-ghost" style="font-size:13px;">Dashboard</a>
            <button onclick="logout()" class="btn btn-ghost" style="font-size:13px;">Logout</button>
        </div>
    </nav>

    <div class="claim-page">
        <div class="page-wrapper">
            <h2 style="font-size:28px;margin-bottom:24px;">Submit a Claim</h2>
            <div class="claim-grid">
                <div>
                    <div class="glass-card" style="margin-bottom:24px;">
                        <h3 style="font-size:16px;margin-bottom:16px;">1. Upload Damage Photo</h3>
                        <div class="dropzone" id="dropzone">
                            <div class="dropzone-icon">📤</div>
                            <div style="font-weight:500;margin-bottom:4px;">Drop image here or click to browse</div>
                            <div style="font-size:12px;color:var(--text-muted);">Supports JPG, PNG</div>
                        </div>
                        <input type="file" id="fileInput" accept="image/*" style="display:none;">
                    </div>
                    <div class="glass-card">
                        <h3 style="font-size:16px;margin-bottom:16px;">2. Claim Details</h3>
                        <div class="form-group">
                            <label class="form-label">Claim Type</label>
                            <select id="claimType">
                                <option>Car</option>
                                <option>House</option>
                                <option>Health</option>
                                <option>Business</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="claimDesc" rows="4" placeholder="Describe what happened..."></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Date of Incident</label>
                            <input type="date" id="claimDate">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Location</label>
                            <input type="text" id="claimLocation" placeholder="City, State">
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary" style="width:100%;margin-bottom:24px;" id="analyzeBtn">Analyze Claim</button>
                    <div id="resultCard" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/claim.js"></script>
</body>
</html>
