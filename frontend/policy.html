<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Analyzer - InsureBot</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <nav class="navbar solid" style="padding:0 40px;">
        <div class="nav-logo">🛡️ InsureBot</div>
        <div class="nav-actions">
            <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
            <a href="dashboard.html" class="btn btn-ghost" style="font-size:13px;">Dashboard</a>
            <button onclick="logout()" class="btn btn-ghost" style="font-size:13px;">Logout</button>
        </div>
    </nav>

    <div style="min-height:100vh;padding-top:80px;">
        <div class="page-wrapper">
            <h2 style="font-size:28px;margin-bottom:24px;">Policy Analyzer</h2>
            <div style="display:flex;gap:16px;margin-bottom:24px;border-bottom:1px solid var(--border-glass);">
                <button class="policy-tab active" data-target="analyzePanel" style="padding:12px 0;background:none;border:none;border-bottom:2px solid var(--accent-primary);color:var(--text-primary);font-size:14px;font-weight:500;cursor:pointer;">Analyze Policy</button>
                <button class="policy-tab" data-target="advicePanel" style="padding:12px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-size:14px;font-weight:500;cursor:pointer;">Pre-Claim Advisor</button>
            </div>

            <div class="policy-panel active" id="analyzePanel">
                <div class="glass-card" style="margin-bottom:24px;">
                    <h3 style="font-size:16px;margin-bottom:16px;">Upload Policy PDF</h3>
                    <div class="dropzone" id="policyDropzone">
                        <div class="dropzone-icon">📄</div>
                        <div style="font-weight:500;">Drop PDF here or click to browse</div>
                    </div>
                    <input type="file" id="policyFile" accept=".pdf" style="display:none;">
                    <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="analyzePolicyBtn">Analyze Policy</button>
                </div>
                <div id="policyResult" style="display:none;"></div>
            </div>

            <div class="policy-panel" id="advicePanel" style="display:none;">
                <div class="glass-card" style="margin-bottom:24px;">
                    <h3 style="font-size:16px;margin-bottom:16px;">Pre-Claim Advisor</h3>
                    <div class="form-group">
                        <label class="form-label">Claim Type</label>
                        <select id="adviceType">
                            <option>Car</option>
                            <option>House</option>
                            <option>Health</option>
                            <option>Business</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="adviceDesc" rows="4" placeholder="Describe the incident..."></textarea>
                    </div>
                    <button class="btn btn-primary" style="width:100%;" id="getAdviceBtn">Get Advice</button>
                </div>
                <div id="adviceResult" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/policy.js"></script>
</body>
</html>
