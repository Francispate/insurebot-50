<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - InsureBot</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">🛡️ InsureBot</div>
        <nav class="sidebar-nav">
            <a href="admin.html" class="active">📊 Dashboard</a>
            <a href="#claims">📋 Claims</a>
            <a href="#users">👥 Users</a>
            <a href="#fraud">🚨 Fraud Queue</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="dashboard.html">🏠 User Home</a>
            <a href="#" onclick="logout()">🚪 Logout</a>
        </div>
    </aside>

    <div class="with-sidebar">
        <div class="admin-page">
            <div class="admin-header">
                <div>
                    <h1 style="font-size:20px;">Welcome, Admin</h1>
                    <div style="font-size:12px;color:var(--text-muted);">Platform overview</div>
                </div>
                <div class="nav-actions">
                    <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
                </div>
            </div>

            <div class="stats-row">
                <div class="glass-card">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Total Users</div>
                    <div style="font-size:32px;font-weight:700;" id="statUsers">0</div>
                </div>
                <div class="glass-card">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Total Claims</div>
                    <div style="font-size:32px;font-weight:700;" id="statClaims">0</div>
                </div>
                <div class="glass-card">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Pending</div>
                    <div style="font-size:32px;font-weight:700;color:var(--warning);" id="statPending">0</div>
                </div>
                <div class="glass-card">
                    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">High Risk</div>
                    <div style="font-size:32px;font-weight:700;color:var(--danger);" id="statRisk">0</div>
                </div>
            </div>

            <div class="charts-row">
                <div class="glass-card">
                    <h3 style="font-size:16px;margin-bottom:16px;">Claims by Type</h3>
                    <canvas id="typeChart" height="200"></canvas>
                </div>
                <div class="glass-card">
                    <h3 style="font-size:16px;margin-bottom:16px;">Fraud Distribution</h3>
                    <canvas id="fraudChart" height="200"></canvas>
                </div>
            </div>

            <div class="table-section" id="claims">
                <div class="glass-card">
                    <h3 style="font-size:16px;margin-bottom:16px;">All Claims</h3>
                    <div style="overflow-x:auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Fraud</th><th>Status</th><th>Date</th><th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="claimsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="table-section" id="users">
                <div class="glass-card">
                    <h3 style="font-size:16px;margin-bottom:16px;">Users</h3>
                    <div style="overflow-x:auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th><th>Email</th><th>Country</th><th>Role</th><th>Joined</th><th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
